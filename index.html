<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FestFund — College Fest Collection Drive</title>

<!-- ============================================================
     CONFIG: after you deploy Code.gs as a Web App, paste its URL
     below in the <script> block (search for "CONFIG").
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#170F2B',
          cream: '#FFF6E9',
          punch: '#FF3E73',
          zap: '#FFC93C',
          cool: '#14B8A6',
          violet: '#7C4DFF',
        },
        fontFamily: {
          display: ['"Space Grotesk"', 'sans-serif'],
          body: ['"Inter"', 'sans-serif'],
          mono: ['"Space Mono"', 'monospace'],
        },
        boxShadow: {
          pop: '0 14px 34px -12px rgba(23,16,43,0.28)',
        },
      },
    },
  };
</script>

<style>
  .bg-dots{ background-image: radial-gradient(rgba(255,246,233,0.14) 1.5px, transparent 1.5px); background-size: 18px 18px; }
  ::selection{ background:#FF3E73; color:#FFF6E9; }
  #contributorList::-webkit-scrollbar{ width:6px; }

  @keyframes popIn{ from{ opacity:0; transform:translateY(8px) scale(.98); } to{ opacity:1; transform:translateY(0) scale(1); } }
  .animate-pop{ animation:popIn .35s ease-out; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }
</style>
</head>

<body class="bg-cream text-ink font-body min-h-screen antialiased">

  <!-- ============ NAV ============ -->
  <header class="sticky top-0 z-40 bg-cream/90 backdrop-blur border-b-2 border-ink/10">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🎟️</span>
        <span class="font-display font-bold text-lg">Fest<span class="text-punch">Fund</span></span>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4">

    <!-- Hero -->
    <div class="relative overflow-hidden bg-ink text-cream rounded-b-[2.5rem] sm:rounded-[2rem] sm:mt-6 px-6 py-10 sm:py-14 bg-dots">
      <span class="hidden sm:block absolute top-6 right-10 text-3xl opacity-30 rotate-12 pointer-events-none">🎊</span>
      <span class="hidden sm:block absolute bottom-8 right-24 text-2xl opacity-20 -rotate-6 pointer-events-none">✨</span>
      <p class="font-display uppercase tracking-[0.3em] text-xs text-zap">College Fest Fund Drive</p>
      <h1 class="font-display text-3xl sm:text-5xl font-bold mt-2 leading-tight">College Fest Fund Drive 🎊</h1>
      <div class="mt-8 flex items-end gap-3">
        <span class="font-mono text-5xl sm:text-6xl font-bold text-zap" id="heroTotal">₹0</span>
        <span class="text-cream/60 pb-2 text-sm">raised so far</span>
      </div>
    </div>

    <!-- Summary cards -->
    <div class="relative -mt-6 sm:-mt-8 grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5">
      <div class="ticket-card relative bg-white rounded-3xl shadow-pop border border-ink/5 px-6 py-6 before:content-[''] before:absolute before:top-1/2 before:-translate-y-1/2 before:-left-3 before:w-6 before:h-6 before:rounded-full before:bg-cream before:z-10 after:content-[''] after:absolute after:top-1/2 after:-translate-y-1/2 after:-right-3 after:w-6 after:h-6 after:rounded-full after:bg-cream after:z-10">
        <p class="text-xs font-semibold uppercase tracking-wide text-ink/50">Total Collected</p>
        <p class="font-mono text-3xl font-bold mt-2" id="cardTotal">₹0</p>
        <div class="border-t-2 border-dashed border-ink/10 my-3"></div>
        <p class="text-xs text-ink/40">from paid contributions</p>
      </div>
      <div class="ticket-card relative bg-white rounded-3xl shadow-pop border border-ink/5 px-6 py-6 before:content-[''] before:absolute before:top-1/2 before:-translate-y-1/2 before:-left-3 before:w-6 before:h-6 before:rounded-full before:bg-cream before:z-10 after:content-[''] after:absolute after:top-1/2 after:-translate-y-1/2 after:-right-3 after:w-6 after:h-6 after:rounded-full after:bg-cream after:z-10">
        <p class="text-xs font-semibold uppercase tracking-wide text-ink/50">Contributors</p>
        <p class="font-mono text-3xl font-bold mt-2"><span id="cardContributors">0</span> <span class="text-base font-body font-normal text-ink/40">students</span></p>
        <div class="border-t-2 border-dashed border-ink/10 my-3"></div>
        <button type="button" onclick="document.getElementById('contributorsSection').scrollIntoView({behavior:'smooth'})" class="text-xs font-display font-semibold text-punch hover:text-ink transition-colors">View All Contributors →</button>
      </div>
    </div>

    <!-- Contributor tabs -->
    <div id="contributorsSection" class="mt-10 mb-16">
      <h2 class="font-display text-xl font-bold mb-4">Contributors 🎊</h2>

      <div id="deptTabs" class="grid grid-cols-3 gap-2 sm:gap-3 mb-5"></div>

      <div class="flex items-center gap-2 mb-4">
        <div class="relative flex-1">
          <input id="searchInput" type="text" placeholder="Search by name…" class="w-full pl-9 pr-4 py-2 rounded-full border-2 border-ink/10 bg-white text-sm focus:outline-none focus:border-punch transition-colors">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-ink/40 text-sm">🔎</span>
        </div>
        <button id="refreshBtn" type="button" class="shrink-0 w-9 h-9 grid place-items-center rounded-full bg-ink/5 hover:bg-ink/10 transition-colors text-lg" title="Refresh">↻</button>
      </div>

      <p id="listState" class="text-center py-10 text-ink/40 text-sm">Loading contributions…</p>
      <div id="contributorList" class="space-y-2"></div>
      <p class="mt-3 text-xs text-ink/40" id="lastUpdated"></p>
    </div>
  </main>

  <footer class="text-center text-xs text-ink/30 py-8">Made with 💛 for the fest crew — data lives in Google Sheets.</footer>

  <script>
    // ============================================================
    // CONFIG — paste your Apps Script Web App URL here
    // ============================================================
    const CONFIG = {
      SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbxHxO-Fj9fta9ylTzc1NqhTRYUZN0QouiMSBSdv9ngPGFwd4TKH8HI1-qkX0mVTkIF1/exec',
    };

    const DEPARTMENTS = ['Commerce', 'Humanity', 'Science'];
    const DEPT_META = {
      Commerce: { icon: '💼', active: 'bg-zap text-ink border-zap' },
      Humanity: { icon: '📚', active: 'bg-violet text-white border-violet' },
      Science:  { icon: '🔬', active: 'bg-cool text-white border-cool' },
    };
    let activeDept = DEPARTMENTS[0];

    let allContributions = [];
    const PALETTE = ['#FF3E73', '#FFC93C', '#14B8A6', '#7C4DFF'];

    // ---------- helpers ----------
    function formatINR(n) { return '₹' + Math.round(n).toLocaleString('en-IN'); }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function hashColor(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h);
      return PALETTE[Math.abs(h) % PALETTE.length];
    }

    function initials(name) {
      return name.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    }

    function animateNumber(el, to, opts = {}) {
      const prefix = opts.prefix || '', suffix = opts.suffix || '';
      const start = parseInt((el.textContent || '0').replace(/[^\d]/g, '') || '0', 10);
      const startTime = performance.now();
      const duration = 700;
      function tick(now) {
        const p = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        const val = Math.round(start + (to - start) * eased);
        el.textContent = prefix + val.toLocaleString('en-IN') + suffix;
        if (p < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    // ---------- public data ----------
    async function loadPublicData() {
      const stateEl = document.getElementById('listState');
      if (CONFIG.SCRIPT_URL.includes('PASTE_YOUR')) {
        stateEl.classList.remove('hidden');
        stateEl.innerHTML = '⚠️ Connect your Google Sheet — paste your Apps Script Web App URL into <code>CONFIG.SCRIPT_URL</code> near the top of the script.';
        return;
      }
      try {
        const res = await fetch(CONFIG.SCRIPT_URL);
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Could not load data.');
        allContributions = data.contributions || [];
        renderSummary(data.summary || { totalAmount: 0, totalContributors: 0 });
        renderTabs();
        renderList(document.getElementById('searchInput').value);
        document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
      } catch (err) {
        stateEl.classList.remove('hidden');
        stateEl.textContent = '⚠️ Could not load data. Check your connection or Apps Script URL.';
        console.error(err);
      }
    }

    function renderSummary(summary) {
      animateNumber(document.getElementById('heroTotal'), summary.totalAmount, { prefix: '₹' });
      animateNumber(document.getElementById('cardTotal'), summary.totalAmount, { prefix: '₹' });
      animateNumber(document.getElementById('cardContributors'), summary.totalContributors, {});
    }

    function contributorCard(c) {
      const name = escapeHtml(c.name), dept = escapeHtml(c.department || '—');
      const paid = c.status === 'Paid';
      return `<div class="animate-pop flex flex-wrap items-center justify-between gap-3 bg-white rounded-2xl px-4 py-3 border border-ink/5 hover:border-punch/30 transition-colors">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-9 h-9 rounded-full grid place-items-center font-display font-bold text-sm text-white shrink-0" style="background:${hashColor(c.name || '?')}">${escapeHtml(initials(c.name || '?'))}</div>
          <div class="min-w-0">
            <p class="font-semibold text-ink truncate">${name}</p>
            <p class="text-xs text-ink/50">${dept}</p>
          </div>
        </div>
        <div class="flex items-center gap-3 shrink-0">
          <span class="font-mono font-bold">₹${Math.round(c.amount)}</span>
          <span class="text-xs font-display font-semibold px-2.5 py-1 rounded-full ${paid ? 'bg-cool/15 text-cool' : 'bg-violet/15 text-violet'}">${paid ? 'Paid' : 'Pending'}</span>
        </div>
      </div>`;
    }

    function renderTabs() {
      const wrap = document.getElementById('deptTabs');
      wrap.innerHTML = DEPARTMENTS.map(dept => {
        const items = allContributions.filter(c => (c.department || '').trim().toLowerCase() === dept.toLowerCase());
        const total = items.reduce((sum, c) => sum + (c.status === 'Paid' ? c.amount : 0), 0);
        const meta = DEPT_META[dept];
        const isActive = dept === activeDept;
        return `<button type="button" data-dept="${dept}" class="dept-tab flex flex-col items-center gap-1 rounded-2xl border-2 px-2 py-4 transition-all ${isActive ? meta.active + ' shadow-pop scale-[1.03]' : 'bg-white border-ink/10 text-ink/60 hover:border-ink/25'}">
          <span class="text-2xl">${meta.icon}</span>
          <span class="font-display font-bold text-sm">${dept}</span>
          <span class="text-xs ${isActive ? 'opacity-80' : 'text-ink/40'}">${items.length} · ${formatINR(total)}</span>
        </button>`;
      }).join('');
      wrap.querySelectorAll('.dept-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          activeDept = btn.dataset.dept;
          renderTabs();
          renderList(document.getElementById('searchInput').value);
        });
      });
    }

    function renderList(filter) {
      const term = (filter || '').trim().toLowerCase();
      const deptItems = allContributions.filter(c => (c.department || '').trim().toLowerCase() === activeDept.toLowerCase());
      const filtered = term ? deptItems.filter(c => c.name.toLowerCase().includes(term)) : deptItems;
      const listEl = document.getElementById('contributorList');
      const stateEl = document.getElementById('listState');

      if (filtered.length === 0) {
        stateEl.classList.remove('hidden');
        stateEl.textContent = deptItems.length === 0 ? `No contributions from ${activeDept} yet — be the first! 🎉` : 'No matches found.';
        listEl.innerHTML = '';
        return;
      }
      stateEl.classList.add('hidden');
      listEl.innerHTML = filtered.map(contributorCard).join('');
    }

    document.getElementById('searchInput').addEventListener('input', e => renderList(e.target.value));
    document.getElementById('refreshBtn').addEventListener('click', loadPublicData);

    // ---------- init ----------
    loadPublicData();
    setInterval(loadPublicData, 45000);
  </script>
</body>
</html>
